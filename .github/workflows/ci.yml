name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cobalt-cockpit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Plugin tests, validation and audit (TypeScript NOT verified here)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: "1"
      CLAUDE_CONFIG_DIR: /tmp/cobalt-cockpit-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned Claude Code
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            https://claude.ai/install.sh \
            --output "$RUNNER_TEMP/claude-install.sh"
          bash "$RUNNER_TEMP/claude-install.sh" 2.1.296
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code version
        shell: bash
        run: |
          set -euo pipefail
          claude --version
          claude --version | grep -F '2.1.296'

      - name: Strict plugin validation
        shell: bash
        run: |
          set -euo pipefail
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .claude-plugin/marketplace.json
          claude plugin validate --strict agents

      - name: Run offline plugin tests
        shell: bash
        run: |
          set -euo pipefail
          claude plugin test .

      - name: TypeScript gate (not automated; separate mandatory release gate)
        shell: bash
        run: |
          set -euo pipefail
          # Deliberately not a pass: nothing is type-checked in this job and it never reports TypeScript as passing.
          echo "::warning title=TypeScript not verified by CI::Automated TypeScript verification is unavailable because Claude Code 2.1.296 does not expose a verified unattended generator for plugin host declarations. TypeScript is a separate mandatory release gate (scripts/typecheck-host.sh, attested in docs/release-checklist-v0.5.3.md)."
          {
            echo "### TypeScript: NOT VERIFIED by this job"
            echo "Automated TypeScript verification is unavailable because Claude Code 2.1.296 does not expose a verified unattended generator for plugin host declarations. TypeScript is a separate mandatory release gate: run \`scripts/typecheck-host.sh\` on the exact release SHA from a host that generated its declarations through an authorized interactive development-plugin load, and record the attestation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Public portability and privacy audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit-public.py

      - name: Check Git whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --check HEAD^ HEAD
